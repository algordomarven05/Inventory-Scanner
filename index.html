<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR & Barcode Receipt Scanner</title>
  <!-- Load HTML5 QR & Barcode Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
    .container { display: flex; gap: 20px; max-width: 1100px; margin: auto; }
    .scanner-box, .receipt-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
    #reader { width: 100%; min-height: 300px; }
    
    /* Mirror video feed horizontally */
    #reader video {
      transform: scaleX(-1);
    }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #007bff; color: white; }
    .btn { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    .btn-stop { background: #dc3545; }
    
    @media print {
      body * { visibility: hidden; }
      .receipt-box, .receipt-box * { visibility: visible; }
      .receipt-box { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
      .btn { display: none; }
    }
  </style>
</head>
<body>

  <h2>Inventory Scanner & Receipt Generator</h2>

  <div class="container">
    <!-- Camera Section -->
    <div class="scanner-box">
      <h3>1. Scan Code</h3>
      <div id="reader"></div>
      <button class="btn btn-stop" id="stop-btn" onclick="stopCamera()" style="display:none;">Stop Camera</button>
    </div>

    <!-- Receipt Section -->
    <div class="receipt-box">
      <h3>2. Scanned Receipt</h3>
      <p><strong>Date:</strong> <span id="receipt-date"></span></p>
      <table>
        <thead>
          <tr>
            <th>Code ID</th>
            <th>Item Name</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody id="receipt-body">
          <!-- Scanned items appear here -->
        </tbody>
      </table>
      <button class="btn" onclick="printReceipt()">Finish & Print Receipt</button>
    </div>
  </div>

  <script>
    const inventoryDB = {
      "123456": "Standard Screwdriver Set",
      "789012": "AA Battery 4-Pack",
      "XYZ-99": "Safety Goggles"
    };

    let html5QrCode = null;
    let scannedItems = {};
    let isCooldown = false;
    let audioCtx = null;

    document.getElementById('receipt-date').innerText = new Date().toLocaleString();

    document.addEventListener('click', function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: false });

    function playBeepSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.warn("Audio playback failed:", e);
      }
    }

    function onScanSuccess(decodedText) {
      if (isCooldown) return;

      isCooldown = true;
      playBeepSound();

      let itemName = inventoryDB[decodedText] || "Unknown Item / Raw Code";

      if (scannedItems[decodedText]) {
        scannedItems[decodedText].qty += 1;
      } else {
        scannedItems[decodedText] = { name: itemName, qty: 1 };
      }

      updateReceiptTable();

      setTimeout(() => {
        isCooldown = false;
      }, 2000);
    }

    function updateReceiptTable() {
      const tbody = document.getElementById('receipt-body');
      tbody.innerHTML = '';

      for (let code in scannedItems) {
        let row = `<tr>
          <td>${code}</td>
          <td>${scannedItems[code].name}</td>
          <td>${scannedItems[code].qty}</td>
        </tr>`;
        tbody.innerHTML += row;
      }
    }

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 20,
        qrbox: { width: 320, height: 200 },
        videoConstraints: {
          width: { min: 640, ideal: 1280, max: 1920 },
          height: { min: 480, ideal: 720, max: 1080 },
          facingMode: "environment"
        },
        // Enable all available 1D and 2D barcode formats
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.AZTEC,
          Html5QrcodeSupportedFormats.PDF_417,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).then(() => {
        document.getElementById('stop-btn').style.display = 'block';
      }).catch(err => {
        console.error("Camera start error:", err);
      });
    }

    function stopCamera() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('stop-btn').style.display = 'none';
        }).catch(err => console.error(err));
      }
    }

    function printReceipt() {
      stopCamera();
      window.print();
    }

    window.addEventListener("load", startCamera);
  </script>

</body>
</html>

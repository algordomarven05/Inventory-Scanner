<script>
  // PASTE YOUR GOOGLE WEB APP URL HERE:
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwu_2kpm2dJfWkYuoIUBPzWAbSBikUb435auHKIx6E6M-jDKriSNxmZBSoJSxWM1nT4/exec";

  let inventory = [];
  let stockInLogs = [];
  let stockOutLogs = [];
  let receiptCounter = 1;

  let scannedReceiptItems = {};
  let html5QrCode = null;
  let isTorchOn = false;
  let lastScannedCode = null;
  let lastScanTime = 0;

  window.addEventListener('load', () => {
    loadFromGoogleSheet();
    generateReceiptNumber();
    startCamera();
    
    // Auto-sync polling every 5 seconds across laptop and all phones
    setInterval(loadFromGoogleSheet, 5000);
  });

  async function loadFromGoogleSheet() {
    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_DEPLOYED_WEB_APP_URL_HERE")) {
      document.getElementById('sync-indicator').innerText = '⚠️ Add Google Script URL';
      document.getElementById('sync-indicator').style.background = '#f39c12';
      return;
    }

    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      if (res.ok) {
        const record = await res.json();
        inventory = record.inventory || [];
        stockInLogs = record.stockInLogs || [];
        stockOutLogs = record.stockOutLogs || [];
        receiptCounter = record.receiptCounter || 1;
        
        document.getElementById('sync-indicator').innerText = '🟢 Live Cloud Synced (Google Sheets)';
        document.getElementById('sync-indicator').style.background = '#28a745';
        refreshAllViews();
      }
    } catch (err) {
      document.getElementById('sync-indicator').innerText = '🔴 Cloud Sync Offline';
      document.getElementById('sync-indicator').style.background = '#d9534f';
    }
  }

  async function saveToGoogleSheet() {
    if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_DEPLOYED_WEB_APP_URL_HERE")) return;
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inventory, stockInLogs, stockOutLogs, receiptCounter })
      });
    } catch (err) {
      console.error("Google Sheets Save Failed", err);
    }
  }

  /* WEB AUDIO BEEP */
  function playBeepSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    refreshAllViews();
  }

  function generateReceiptNumber() {
    const date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const seq = String(receiptCounter).padStart(4, '0');
    const office = document.getElementById('req-office').value.toUpperCase() || 'PGSO';
    document.getElementById('receipt-no').innerText = `${office}-${year}-${month}-${seq}`;
    document.getElementById('receipt-date').innerText = date.toLocaleString();
  }

  /* CAMERA & SCANNER ENGINE */
  function startCamera() {
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 15, qrbox: { width: 250, height: 180 } };
    html5QrCode.start({ facingMode: "environment" }, config, onCodeScanned).catch(err => console.log(err));
  }

  function stopCamera() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => html5QrCode.clear()).catch(err => console.log(err));
    }
  }

  function onCodeScanned(code) {
    const now = Date.now();
    if (code === lastScannedCode && (now - lastScanTime) < 1500) return;
    lastScannedCode = code;
    lastScanTime = now;
    playBeepSound();

    let item = inventory.find(i => i.code === code);
    let name = item ? item.name : "Unknown Item / Raw Code";

    if (scannedReceiptItems[code]) scannedReceiptItems[code].qty++;
    else scannedReceiptItems[code] = { name: name, qty: 1 };
    renderReceipt();
  }

  function toggleTorch() {
    if (html5QrCode) {
      isTorchOn = !isTorchOn;
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] }).catch(err => alert("Flashlight not supported."));
    }
  }

  /* RECEIPT ACTIONS */
  function renderReceipt() {
    const tbody = document.getElementById('receipt-rows');
    tbody.innerHTML = '';
    for (let code in scannedReceiptItems) {
      let item = scannedReceiptItems[code];
      tbody.innerHTML += `
        <tr>
          <td>${code}</td>
          <td>${item.name}</td>
          <td style="text-align: center;">
            <div class="qty-controls">
              <button class="qty-btn no-print" onclick="modQty('${code}', -1)">-</button>
              <span>${item.qty}</span>
              <button class="qty-btn no-print" onclick="modQty('${code}', 1)">+</button>
            </div>
          </td>
          <td class="no-print" style="text-align: center;"><button class="btn btn-danger" onclick="removeReceiptItem('${code}')">X</button></td>
        </tr>`;
    }
  }

  function modQty(code, delta) {
    if (scannedReceiptItems[code]) {
      scannedReceiptItems[code].qty += delta;
      if (scannedReceiptItems[code].qty <= 0) delete scannedReceiptItems[code];
      renderReceipt();
    }
  }

  function removeReceiptItem(code) { delete scannedReceiptItems[code]; renderReceipt(); }
  function clearReceipt() { scannedReceiptItems = {}; renderReceipt(); }

  /* ACTION 1: COMPLETE RELEASE ONLY */
  function completeReleaseOnly() {
    const receiptNo = document.getElementById('receipt-no').innerText;
    const office = document.getElementById('req-office').value;
    const requester = document.getElementById('req-name').value;

    if (Object.keys(scannedReceiptItems).length === 0) {
      alert("No items in receipt to release.");
      return;
    }

    for (let code in scannedReceiptItems) {
      let qty = scannedReceiptItems[code].qty;
      let invItem = inventory.find(i => i.code === code);
      if (invItem) invItem.stock = Math.max(0, invItem.stock - qty);
      stockOutLogs.push({ receiptNo, date: new Date().toLocaleString(), office, requester, code, qty });
    }

    receiptCounter++;
    saveToGoogleSheet();
    scannedReceiptItems = {};
    generateReceiptNumber();
    renderReceipt();
    refreshAllViews();
    alert("Property release completed & synced to Google Sheet!");
  }

  /* ACTION 2: PRINT RECEIPT ONLY */
  function printReceiptOnly() {
    if (Object.keys(scannedReceiptItems).length === 0) {
      alert("No items to print.");
      return;
    }
    window.print();
  }

  /* INVENTORY HELPERS */
  function calculateStatus(item) {
    const today = new Date();
    if (item.expiry) {
      const expDate = new Date(item.expiry);
      const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
      item.daysLeft = diffDays;
      if (diffDays <= 0) return { label: 'Expired', class: 'bg-expired' };
      if (diffDays <= 30) return { label: 'Expiring Soon', class: 'bg-expiring' };
    } else { item.daysLeft = 'N/A'; }

    if (item.stock <= 0) return { label: 'Out of Stock', class: 'bg-out' };
    if (item.stock <= Math.floor(item.min / 2)) return { label: 'Critical', class: 'bg-critical' };
    if (item.stock <= item.min) return { label: 'Low Stock', class: 'bg-low' };
    return { label: 'OK', class: 'bg-ok' };
  }

  function renderInventoryTable() {
    const tbody = document.getElementById('inventory-table-body');
    tbody.innerHTML = '';
    inventory.forEach((item, index) => {
      const status = calculateStatus(item);
      tbody.innerHTML += `
        <tr>
          <td>${index + 1}</td>
          <td><strong>${item.name}</strong></td>
          <td>${item.category || '-'}</td>
          <td>${item.code}</td>
          <td>${item.location || '-'}</td>
          <td>${item.unit || '-'}</td>
          <td><strong>${item.stock}</strong></td>
          <td>${item.min}</td>
          <td>${item.batch || '-'}</td>
          <td>${item.expiry || '-'}</td>
          <td>${item.daysLeft}</td>
          <td><span class="badge ${status.class}">${status.label}</span></td>
        </tr>`;
    });
  }

  function openItemModal() { document.getElementById('itemModal').style.display = 'block'; }
  function openStockInModal() { document.getElementById('stockInModal').style.display = 'block'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function saveInventoryItem() {
    const item = {
      name: document.getElementById('m-name').value,
      category: document.getElementById('m-category').value,
      code: document.getElementById('m-code').value,
      location: document.getElementById('m-location').value,
      unit: document.getElementById('m-unit').value,
      stock: parseInt(document.getElementById('m-stock').value) || 0,
      min: parseInt(document.getElementById('m-min').value) || 5,
      batch: document.getElementById('m-batch').value,
      expiry: document.getElementById('m-expiry').value
    };

    const existingIdx = inventory.findIndex(i => i.code === item.code);
    if (existingIdx >= 0) inventory[existingIdx] = item;
    else inventory.push(item);

    saveToGoogleSheet();
    closeModal('itemModal');
    refreshAllViews();
  }

  function processStockIn() {
    const code = document.getElementById('si-code').value;
    const qty = parseInt(document.getElementById('si-qty').value) || 0;
    const office = document.getElementById('si-office').value;
    const staff = document.getElementById('si-staff').value;
    const batch = document.getElementById('si-batch').value;
    const location = document.getElementById('si-location').value;
    const notes = document.getElementById('si-notes').value;

    let item = inventory.find(i => i.code === code);
    if (item) {
      item.stock += qty;
      if (location) item.location = location;
      if (batch) item.batch = batch;
    }

    stockInLogs.push({ date: new Date().toLocaleDateString(), code, name: item ? item.name : 'Unknown', qty, office, staff, batch, location, notes });
    saveToGoogleSheet();
    closeModal('stockInModal');
    refreshAllViews();
  }

  function refreshDashboard() {
    let units = 0, ok = 0, low = 0, critical = 0, out = 0, expiring = 0, expired = 0;
    inventory.forEach(item => {
      units += item.stock;
      const st = calculateStatus(item);
      if (st.label === 'OK') ok++;
      if (st.label === 'Low Stock') low++;
      if (st.label === 'Critical') critical++;
      if (st.label === 'Out of Stock') out++;
      if (st.label === 'Expiring Soon') expiring++;
      if (st.label === 'Expired') expired++;
    });

    document.getElementById('dash-total').innerText = inventory.length;
    document.getElementById('dash-units').innerText = units;
    document.getElementById('dash-ok').innerText = ok;
    document.getElementById('dash-low').innerText = low;
    document.getElementById('dash-critical').innerText = critical;
    document.getElementById('dash-out').innerText = out;
    document.getElementById('dash-expiring').innerText = expiring;
    document.getElementById('dash-expired').innerText = expired;
  }

  function refreshAllViews() {
    renderInventoryTable();
    refreshDashboard();
    renderStockInTable();
    renderStockOutTable();
    renderHistoryTable();
  }

  function renderStockInTable() {
    const tbody = document.getElementById('stockin-table-body');
    tbody.innerHTML = '';
    stockInLogs.forEach((l, i) => {
      tbody.innerHTML += `<tr><td>${i+1}</td><td>${l.date}</td><td>${l.code}</td><td>${l.name}</td><td>${l.qty}</td><td>${l.office}</td><td>${l.staff}</td><td>${l.batch}</td><td>${l.location}</td><td>${l.notes}</td></tr>`;
    });
  }

  function renderStockOutTable() {
    const tbody = document.getElementById('stockout-table-body');
    tbody.innerHTML = '';
    stockOutLogs.forEach(l => {
      tbody.innerHTML += `<tr><td>${l.receiptNo}</td><td>${l.date}</td><td>${l.office}</td><td>${l.requester}</td><td>${l.code}</td><td>${l.qty}</td></tr>`;
    });
  }

  function renderHistoryTable() {
    const tbody = document.getElementById('history-table-body');
    tbody.innerHTML = '';
    stockInLogs.forEach(l => {
      tbody.innerHTML += `<tr><td>${l.date}</td><td>Stock In</td><td>-</td><td>${l.office}</td><td>${l.code}</td><td>+${l.qty}</td></tr>`;
    });
    stockOutLogs.forEach(l => {
      tbody.innerHTML += `<tr><td>${l.date}</td><td>Stock Out</td><td>${l.receiptNo}</td><td>${l.office}</td><td>${l.code}</td><td>-${l.qty}</td></tr>`;
    });
  }

  function exportMonthlyCSV() {
    let csv = "Date,Type,Reference No,Office,Code,Qty\n";
    stockInLogs.forEach(l => { csv += `"${l.date}","Stock In","-","${l.office}","${l.code}",${l.qty}\n`; });
    stockOutLogs.forEach(l => { csv += `"${l.date}","Stock Out","${l.receiptNo}","${l.office}","${l.code}",-${l.qty}\n`; });
    let blob = new Blob([csv], { type: 'text/csv' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `PGSO_Monthly_Report_${Date.now()}.csv`;
    link.click();
  }
</script>
